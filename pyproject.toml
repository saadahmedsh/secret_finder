[project]
name = "secret-finder"
version = "0.1.0"
description = "CLI tool to detect exposed secrets within Git changes"
readme = "README.md"
authors = [
    { name = "Saad Ahmad" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
secret-finder = "secret_finder.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
